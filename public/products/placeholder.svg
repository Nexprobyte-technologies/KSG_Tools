<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)" />
  <rect width="600" height="600" fill="url(#grid)" />

  <!-- Center Circle -->
  <circle cx="300" cy="270" r="110" fill="rgba(37, 99, 235, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="300" cy="270" r="85" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>

  <!-- Industrial Tool / Caliper Icon -->
  <g transform="translate(252, 222) scale(1.6)" stroke="url(#cyanGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
    <path d="m19 19-3-3" />
    <path d="m9 9-2-2" />
  </g>

  <!-- Brand KSG Badge -->
  <rect x="235" y="380" width="130" height="28" rx="14" fill="rgba(37, 99, 235, 0.25)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
  <text x="300" y="399" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">K.S.G. TOOLS</text>

  <!-- Text -->
  <text x="300" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" letter-spacing="0.5">Industrial Tooling Specification</text>
  <text x="300" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Coimbatore · Precision Engineering Since 2009</text>
  <text x="300" y="505" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Custom Dimensions &amp; CAD Drawings On Enquiry</text>
</svg>

